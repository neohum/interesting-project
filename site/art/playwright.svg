<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="640" height="400" fill="#e9edf2"/>
  <g transform="translate(24 30)">
    <rect width="330" height="340" rx="12" fill="#0f1419"/>
    <circle cx="18" cy="16" r="5" fill="#ff5f57"/><circle cx="34" cy="16" r="5" fill="#febc2e"/><circle cx="50" cy="16" r="5" fill="#28c840"/>
    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5">
      <text x="16" y="56" fill="#7ee787">$ <tspan fill="#e6edf3">playwright-cli open demo.playwright.dev/todomvc</tspan></text>
      <text x="16" y="80" fill="#8b949e">  ✓ 브라우저 열림 (chromium, headed)</text>
      <text x="16" y="110" fill="#7ee787">$ <tspan fill="#e6edf3">playwright-cli type "장보기"</tspan></text>
      <text x="16" y="134" fill="#7ee787">$ <tspan fill="#e6edf3">playwright-cli press Enter</tspan></text>
      <text x="16" y="158" fill="#7ee787">$ <tspan fill="#e6edf3">playwright-cli check e21</tspan></text>
      <text x="16" y="188" fill="#7ee787">$ <tspan fill="#e6edf3">playwright-cli screenshot</tspan></text>
      <text x="16" y="212" fill="#8b949e">  ✓ page-2026-10-20.png 저장</text>
      <text x="16" y="242" fill="#d2a8ff">// 생성된 코드</text>
      <text x="16" y="264" fill="#79c0ff">await <tspan fill="#e6edf3">page.getByRole('textbox')</tspan></text>
      <text x="16" y="284" fill="#e6edf3">  .fill(<tspan fill="#a5d6ff">'장보기'</tspan>);</text>
      <text x="16" y="306" fill="#79c0ff">await <tspan fill="#e6edf3">page.keyboard.press(</tspan><tspan fill="#a5d6ff">'Enter'</tspan><tspan fill="#e6edf3">);</tspan></text>
    </g>
  </g>
  <g transform="translate(378 64)">
    <rect width="240" height="272" rx="10" fill="#fff" stroke="#c9d1db"/>
    <rect width="240" height="30" rx="10" fill="#f1f3f6"/><rect x="40" y="9" width="180" height="13" rx="6" fill="#fff" stroke="#d8dee6"/>
    <text x="120" y="70" text-anchor="middle" font-size="30" fill="#e5a3a3" font-weight="300">todos</text>
    <g font-size="13" fill="#333">
      <rect x="20" y="88" width="200" height="34" fill="#fff" stroke="#e6e6e6"/><text x="34" y="110" fill="#bbb">할 일 입력…</text>
      <rect x="20" y="122" width="200" height="34" fill="#fff" stroke="#e6e6e6"/><circle cx="38" cy="139" r="8" fill="none" stroke="#5dc2af"/><path d="M34 139l3 3 6-6" stroke="#5dc2af" fill="none" stroke-width="1.6"/><text x="56" y="144" fill="#bbb" text-decoration="line-through">장보기</text>
      <rect x="20" y="156" width="200" height="34" fill="#fff" stroke="#e6e6e6"/><circle cx="38" cy="173" r="8" fill="none" stroke="#ddd"/><text x="56" y="178">화분 물 주기</text>
    </g>
    <rect x="16" y="118" width="208" height="42" rx="4" fill="none" stroke="#2ead33" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="220" y="114" text-anchor="end" font-size="11" fill="#2ead33">e21</text>
    <g font-size="11" fill="#57606a"><rect x="20" y="214" width="200" height="40" rx="8" fill="#f6f8fa"/><text x="32" y="238">📸 스크린샷 · 1280×720</text></g>
  </g>
</svg>
